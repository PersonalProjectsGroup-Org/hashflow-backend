name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  # Needed to react (👀) to the /review comment for instant feedback.
  issues: write

# Cancel a running review if new commits are pushed to the PR. The group is
# scoped per event type: issue comments (e.g. the Trello card-link comment)
# spawn runs that skip, and without this suffix they would cancel the real
# pull_request review in progress.
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  review:
    # Run on PR events, or on a "/review" comment on a pull request.
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body || '', '/review'))
    runs-on: ubuntu-latest
    # Must exceed 2 attempts x 4 models x 240s worst case (~32 min) so the
    # failure path (comment + exit 0) always runs instead of being killed.
    timeout-minutes: 40
    # Reviews are informational: never turn the PR red if the API hiccups.
    continue-on-error: true
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Free-only fallback list. openrouter/free (auto-route) is FIRST: it is the
      # only model that reliably answers on the free tier (observed 8/10 runs;
      # the pinned models time out at 90s almost every time, so routing through
      # the router first keeps reviews fast). The pins stay as quality fallbacks
      # when the router itself is down. Free models are retired often — refresh
      # the pins with:
      #   curl -sS https://openrouter.ai/api/v1/models | jq -r '.data[].id' | grep ':free'
      MODELS: openrouter/free,openai/gpt-oss-20b:free,google/gemma-4-31b-it:free,cohere/north-mini-code:free
      MAX_DIFF_CHARS: 30000
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

    steps:
      - name: Acknowledge /review (instant feedback)
        # Give immediate visual feedback that the manual /review trigger was
        # received: react with 👀 on the comment a few seconds after posting.
        # (The review check also shows as "pending" in the PR checks section.)
        if: github.event_name == 'issue_comment' && env.OPENROUTER_API_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" \
            -H "Accept: application/vnd.github.squirrel-girl-preview+json" \
            -f content=eyes || true

      - name: Resolve PR head and base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            # issue_comment (/review): the SHAs are not in the event; look them up.
            HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -q '.head.sha')
            BASE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -q '.base.sha')
          fi
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Warn when API key is missing
        if: env.OPENROUTER_API_KEY == ''
        run: echo "::warning::OPENROUTER_API_KEY secret is not set — AI review skipped. Add it in Settings → Secrets and variables → Actions."

      - name: Authorize /review (write access only)
        # Prevents anyone without write access (or the bot itself) from
        # triggering reviews and burning Actions minutes.
        if: github.event_name == 'issue_comment'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "AUTHORIZED=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "AUTHORIZED=false" >> "$GITHUB_ENV"
              echo "::warning::User ${{ github.actor }} cannot trigger /review (write access required)."
              ;;
          esac

      - name: Run AI review
        if: env.OPENROUTER_API_KEY != '' && (github.event_name == 'pull_request' || env.AUTHORIZED == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$BASE_SHA"

          # Compute the PR diff (changes on the head branch since it diverged
          # from base), excluding Gradle noise: .gradle caches and build/
          # outputs are committed in this repo but are not reviewable code —
          # the model cannot verify them and they are a top source of
          # hallucinated comments.
          git diff "$BASE"...HEAD -- . \
            ':(exclude)**/.gradle/**' \
            ':(exclude)**/build/**' \
            ':(exclude)**/gradle-wrapper.jar' > /tmp/pr.diff || true

          if [ ! -s /tmp/pr.diff ]; then
            gh pr comment "$PR_NUMBER" --body "🤖 AI review: no code changes to review in this PR (Gradle-cache/build-output-only or empty diff)."
            exit 0
          fi

          # Repo facts: exact stack versions from the Gradle build files, so
          # the model does not apply conventions from other frameworks or
          # older major versions.
          SPRING_BOOT=$(grep -hoE "org.springframework.boot.*version ['\"]?[0-9]+\.[0-9]+\.[0-9]+" build.gradle.kts services/service-telemetry/build.gradle 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | sort -u | head -1 || true)
          GRADLE=$(grep -hoE "gradle-[0-9.]+" gradle/wrapper/gradle-wrapper.properties services/service-telemetry/gradle/wrapper/gradle-wrapper.properties 2>/dev/null | head -1 | sed 's/^gradle-//' || true)
          MODULES=$(grep -E '^[[:space:]]*include\(' settings.gradle.kts 2>/dev/null | sed -E 's/.*"([^"]+)".*/\1/' | tr '\n' ',' | sed 's/,$//' || echo "n/a")
          REPO_FACTS="Spring Boot ${SPRING_BOOT:-n/a}, Gradle ${GRADLE:-n/a}, modules: ${MODULES:-n/a}; Java 17+ (Spring Boot 3 baseline); root package com.hashflow; service-telemetry uses Lombok, Spring Data JPA + PostgreSQL, and WebFlux"
          echo "Repo facts: $REPO_FACTS"

          # Keep very large diffs within the model's context window.
          if [ "$(wc -c < /tmp/pr.diff)" -gt "$MAX_DIFF_CHARS" ]; then
            head -c "$MAX_DIFF_CHARS" /tmp/pr.diff > /tmp/pr.truncated.diff
            mv /tmp/pr.truncated.diff /tmp/pr.diff
          fi

          # Extract (path, new-file line) pairs for lines ADDED in this diff.
          # Only those lines can receive inline review comments.
          awk '
          /^\+\+\+ b\// { path=$0; sub(/^\+\+\+ b\//,"",path); next }
          /^@@ / { s=$0; sub(/^@@ -[0-9]+(,[0-9]+)? \+/,"",s); sub(/,.*/,"",s); new_line=s+0; next }
          /^\+/ && !/^\+\+\+/ { print path "\t" new_line; new_line++; next }
          /^ / { new_line++ }
          ' /tmp/pr.diff > /tmp/valid_lines.txt || true

          # Prior review threads on this PR (for dedupe + "do not repeat" context).
          # A fresh model run has no memory; without this, re-reviews re-raise the
          # exact points already raised and answered on the PR.
          PRIOR_SUMMARY="none"
          PRIOR_FILE=$(mktemp)
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate > /tmp/prior_raw.json 2>/dev/null; then
            jq -r '.[] | [(.path // ""), (.line // 0), ((.body // "") | split("\n")[0] | split("] ") | .[1:] | join("] "))] | @tsv' /tmp/prior_raw.json > "$PRIOR_FILE" 2>/dev/null || true
            PRIOR_SUMMARY=$(awk -F'\t' 'NF>=3 {print $1":"$2" — "substr($3,1,160)}' "$PRIOR_FILE" | head -8)
            [ -z "$PRIOR_SUMMARY" ] && PRIOR_SUMMARY="none"
            echo "Prior review threads: $(wc -l < "$PRIOR_FILE")"
          else
            echo "No prior review threads."
          fi

          # Try the free models in order (fallback list), building the payload
          # per model. Stops at the first model that returns content.
          ACTUAL_MODEL=""
          RESPONSE=""
          CURL_RC=0
          HTTP_CODE=""
          # Consecutive *instant* failures (degenerate replies or HTTP 429)
          # mean the free-tier pool is saturated: the remaining models will
          # stall for minutes each (observed: 17 min of foregone 240s
          # timeouts on PR #19). After 3, abort with a clear message instead
          # of grinding the whole fallback loop.
          INSTANT_FAILS=0
          for MODEL in $(printf '%s' "$MODELS" | tr ',' ' '); do
            echo "Trying model: $MODEL"
            PAYLOAD=$(jq -n \
                --arg model "$MODEL" \
                --arg repo_facts "$REPO_FACTS" \
                --arg prior "$PRIOR_SUMMARY" \
                --rawfile diff /tmp/pr.diff \
                '{
                  model: $model,
                  temperature: 0.2,
                  messages: [
                    {
                      role: "system",
                      content: ("You are a senior code reviewer for a Java + Spring Boot backend project (multi-module Gradle microservices: service-telemetry, service-financial, service-agent, service-news). Review the pull request diff. Be concise and concrete. Flag real issues only — avoid nitpicks and false positives. Reply in the language of the PR description if it is not English.\n\nREPO STACK (current versions — do not flag patterns as wrong based on older major versions or other frameworks):\n" + $repo_facts + "\n\nProject rules: contract-first (public API shapes come from the shared OpenAPI spec in hashflow-infra; services never define them locally), microservice isolation (database-per-service), and business rules RN01-RN12 are normative.")
                    },
                    {
                      role: "user",
                      content: ("Review this pull request diff. Respond with ONLY a JSON object — no markdown fences, no extra text. Shape:\n{\"summary\": \"2-3 sentence overview of what the PR does and your overall impression\", \"comments\": [{\"path\": \"path/to/File.java\", \"line\": 42, \"severity\": \"ERROR|WARNING|SUGGESTION\", \"message\": \"short description and suggested fix\", \"evidence\": \"the exact flagged line copied verbatim from the diff\", \"suggestion\": \"optional replacement code for that one line\"}]}\n\nRules:\n- \"path\" must match the diff exactly; \"line\" must be the line number in the NEW version of the file and must be a line added by this PR.\n- \"evidence\" is REQUIRED on every comment: copy the flagged line verbatim from the diff. If you cannot quote the exact line, do not write the comment.\n- \"suggestion\" is optional: for issues with a clear mechanical fix, include the full replacement for the flagged line only, with the same indentation as the original line. Never wrap it in markdown fences. Never suggest code that is already present in the file — check the flagged line first.\n- Flag only real issues, at most 5 comments. Focus on bugs, logic errors, missing error handling, security problems (hardcoded secrets, unsafe patterns), concurrency and null-safety issues, and Spring/Java pitfalls (bean wiring, transactions, exception handling, resource leaks).\n- NEVER claim that an API, function, or property does not exist or is not valid: you cannot inspect the project dependencies (Spring/Java jars), so you cannot prove absence. If unsure, omit the comment.\n- NEVER assert a fact you cannot verify from the provided files. If unsure about a library version, config, or ecosystem convention, phrase it as a question or omit it.\n- Do not comment on context lines that this PR does not add.\n- .gradle/ caches and build/ outputs are excluded from this diff; do not comment on them.\n- Prefer returning an empty comments array over inventing issues.\n- If there are no issues, return {\"summary\": \"...\", \"comments\": []}.\n\nExamples of comments you must NOT write — real false positives caught on this project family:\n- \"X is not a class / does not exist\" — when X is a standard Spring or Java API; the dependency jars are not visible to you, so absence cannot be proven.\n- \"Add an explicit type to the parameter\" — when the parameter is already typed; check the line before commenting.\n- \"The return type must be List<X>\" — when the method already declares it; the build would fail otherwise.\n- \"Missing null check\" — when the line(s) immediately above already guard null; check the surrounding code before claiming absence.\n- \"Resource leak / missing close\" — when the code uses try-with-resources correctly; do not claim a bug in code that is not there.\n\nAlready-raised review points on this PR (do NOT repeat them):\n" + $prior + "\n\nDiff (truncated to the first part if very large):\n" + $diff)
                    }
                  ]
                }')

            for attempt in 1 2; do
              # Free tier routinely takes 60-90s to first token under queue load
              # and >90s when saturated (the 3x failure on PR #19 was exactly
              # that: every attempt hit the old 90s cap). 240s keeps the review
              # alive through queue spikes. Capture the HTTP status (-w) and
              # curl exit code separately so a failure is diagnosable: exit 28 =
              # timeout (HTTP_CODE 000), 429/5xx = OpenRouter rejecting.
              CURL_RC=0
              RESP_FILE=$(mktemp)
              HTTP_CODE=$(curl -sS --max-time 240 -o "$RESP_FILE" -w '%{http_code}' \
                https://openrouter.ai/api/v1/chat/completions \
                -H "Authorization: Bearer $OPENROUTER_API_KEY" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD") || CURL_RC=$?
              RESPONSE=$(cat "$RESP_FILE" 2>/dev/null || true)
              rm -f "$RESP_FILE"
              CONTENT=$(printf '%s' "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
              if [ -n "$CONTENT" ]; then
                # Accept only a well-formed JSON review or a substantial text
                # reply. Free-tier models occasionally return degenerate
                # snippets (e.g. "User Safety: safe") — those are not reviews.
                if printf '%s' "$CONTENT" | jq -e 'type == "object" and (has("summary") or has("comments"))' >/dev/null 2>&1 \
                   || [ "${#CONTENT}" -ge 40 ]; then
                  ACTUAL_MODEL="$MODEL"
                  echo "Model $MODEL responded (attempt $attempt)."
                  break 2
                fi
                # Degenerate snippet — not a review. Retrying this model is
                # cheap (~2s), so give it attempt 2 before moving on, and count
                # it as an instant failure toward the saturation abort.
                INSTANT_FAILS=$((INSTANT_FAILS + 1))
                echo "::warning::Model $MODEL returned degenerate output (${#CONTENT} chars) — instant fail $INSTANT_FAILS/3; retrying..."
                if [ "$INSTANT_FAILS" -ge 3 ]; then
                  echo "::warning::Free-tier pool saturated ($INSTANT_FAILS consecutive instant failures); aborting fallback loop."
                  gh pr comment "$PR_NUMBER" --body "🤖 AI review failed: OpenRouter free-tier pool is saturated right now (degenerate responses from every model). Retry the review in a few hours, or rely on the repository CI checks." || true
                  exit 0
                fi
                sleep 2
                continue
              fi
              if [ "$HTTP_CODE" = "429" ]; then
                INSTANT_FAILS=$((INSTANT_FAILS + 1))
                echo "::warning::Model $MODEL HTTP 429 (rate limit/quota) — instant fail $INSTANT_FAILS/3; retrying..."
                if [ "$INSTANT_FAILS" -ge 3 ]; then
                  echo "::warning::Free-tier quota/rate limit exhausted ($INSTANT_FAILS consecutive instant failures); aborting fallback loop."
                  gh pr comment "$PR_NUMBER" --body "🤖 AI review failed: OpenRouter free-tier rate limit/quota is exhausted right now (HTTP 429 responses). Retry the review in a few hours, or rely on the repository CI checks." || true
                  exit 0
                fi
                sleep 5
                continue
              fi
              echo "::warning::Model $MODEL attempt $attempt/2 failed (curl exit $CURL_RC, HTTP $HTTP_CODE); retrying in 5s..."
              sleep 5
            done
          done

          if [ -z "$ACTUAL_MODEL" ]; then
            ERROR=$(printf '%s' "$RESPONSE" | jq -r '.error.message // empty' 2>/dev/null || true)
            [ -z "$ERROR" ] && ERROR="All models in the fallback list failed (last attempt: curl exit $CURL_RC, HTTP $HTTP_CODE)"
            echo "::warning::OpenRouter review failed: $ERROR"
            echo "::warning::Last response body: $(printf '%s' "$RESPONSE" | head -c 500)"
            gh pr comment "$PR_NUMBER" --body "🤖 AI review failed: $ERROR" || true
            exit 0
          fi

          RAW_CONTENT=$(printf '%s' "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null || true)
          # Some models wrap the JSON in markdown fences despite the prompt. Strip a
          # leading ```lang line and a trailing ``` line so the review parses and
          # flows through the added-lines filter + degenerate-output guard instead
          # of being posted raw to the PR.
          REVIEW_JSON=$(printf '%s' "$RAW_CONTENT" | sed -E '1{/^```[[:alnum:]]*$/d}; ${/^```$/d}')

          # Model reply should be a JSON object: {summary, comments:[{path,line,severity,message}]}
          SUMMARY=$(printf '%s' "$REVIEW_JSON" | jq -r '.summary // empty' 2>/dev/null || true)

          if [ -z "$SUMMARY" ]; then
            # Model output did not parse as the expected JSON shape. Post it as
            # a plain comment only if it is substantial; skip degenerate output.
            if printf '%s' "$REVIEW_JSON" | jq -e 'type == "object"' >/dev/null 2>&1 \
               || [ "${#REVIEW_JSON}" -ge 40 ]; then
              BODY=$(cat <<EOF
          ## 🤖 AI Code Review
          Model: \`$ACTUAL_MODEL\`

          $REVIEW_JSON
          EOF
          )
              gh pr comment "$PR_NUMBER" --body "$BODY" || true
            else
              echo "::warning::Model returned degenerate output; skipping review post: $(printf '%s' "$REVIEW_JSON" | head -c 120)"
            fi
            exit 0
          fi

          # ---------- anti-hallucination filters ----------
          # The position of each comment is validated (path+line must be a line
          # added by this PR) AND its content is grounded in the diff: evidence
          # must match the real line, suggestions must not duplicate existing
          # code, "does not exist" claims are checked against the repo, and
          # prior review threads are not repeated. Free models hallucinate
          # despite prompt rules — these gates are the enforcement.
          printf '%s' "$REVIEW_JSON" > /tmp/review.json
          cat > /tmp/filter-review.mjs <<'NODE'
          import fs from 'node:fs';

          const DIFF = '/tmp/pr.diff';
          const REVIEW = '/tmp/review.json';
          const PRIOR = '/tmp/prior.txt';

          // ---------- parse the diff: added lines -> (path, line, content) ----------
          const added = new Map();      // "path\tline" -> content of the added line
          const fileAdded = new Map();  // path -> all added content, joined
          let path = '';
          let newLine = 0;
          for (const rawLine of fs.readFileSync(DIFF, 'utf8').split('\n')) {
            // Strip CR from CRLF-authored diffs: JS regex dot does not match \r,
            // so the +++ b/ path regex would fail on Windows-authored PRs.
            const raw = rawLine.replace(/\r$/, '');
            const pm = raw.match(/^\+\+\+ b\/(.*)$/);
            if (pm) { path = pm[1]; continue; }
            const hm = raw.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
            if (hm) { newLine = Number(hm[2]); continue; }
            if (raw.startsWith('+') && !raw.startsWith('+++')) {
              const content = raw.slice(1);
              added.set(path + '\t' + newLine, content);
              fileAdded.set(path, (fileAdded.get(path) ?? '') + '\n' + content);
              newLine += 1;
            } else if (raw.startsWith(' ') && !raw.startsWith('@@')) {
              newLine += 1;
            }
          }

          // ---------- text similarity helpers ----------
          const norm = (s) => String(s ?? '').trim().replace(/\s+/g, ' ');
          const lower = (s) => norm(s).toLowerCase();
          const toks = (s) => lower(s).split(/[^a-z0-9_]+/).filter((t) => t.length > 1);
          const jaccard = (a, b) => {
            const A = new Set(a), B = new Set(b);
            let inter = 0;
            for (const t of A) if (B.has(t)) inter += 1;
            const union = A.size + B.size - inter;
            return union === 0 ? 0 : inter / union;
          };
          const evidenceMatches = (evidence, content) => {
            const e = lower(evidence), c = lower(content);
            if (!e || !c) return false;
            if (e.length >= 12 && (c.includes(e) || e.includes(c))) return true;
            return jaccard(toks(e), toks(c)) >= 0.5;
          };

          // ---------- identifier existence check against the repo ----------
          const SCAN_DIRS = ['services', 'buildSrc'];
          const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          function tokenExistsInRepo(token) {
            if (!/^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$/.test(token)) return false;
            const re = new RegExp('\\b' + escRe(token) + '\\b');
            for (const dir of SCAN_DIRS) {
              if (!fs.existsSync(dir)) continue;
              const stack = [dir];
              while (stack.length) {
                const cur = stack.pop();
                let entries;
                try { entries = fs.readdirSync(cur, { withFileTypes: true }); } catch { continue; }
                for (const en of entries) {
                  if (en.name.startsWith('.') || en.name.endsWith('.map')) continue;
                  const full = cur + '/' + en.name;
                  if (en.isDirectory()) { stack.push(full); continue; }
                  if (!/\.(java|kt|kts|gradle|groovy|xml|properties|yml|yaml)$/.test(en.name)) continue;
                  let head = '';
                  try { head = fs.readFileSync(full, 'utf8').slice(0, 262144); } catch { continue; }
                  if (re.test(head)) return true;
                }
              }
            }
            return false;
          }

          const NEGATION = /(does not exist|doesn't exist|is not a (function|method|property|valid|supported|standard)|is not defined|isn't (a |an )?valid|not a (function|method|property))/i;
          const EFFECT_CLAIM = /useEffect|useMemo|useCallback/i;
          const RACE_CLAIM = /(dependenc|deps|race|cleanup|unmount)/i;
          const RESOURCE_CLAIM = /resource\s*leak|missing\s*(close|cleanup)|fails\s*to\s*close/i;

          // ---------- prior review threads (dedupe) ----------
          const prior = [];
          if (fs.existsSync(PRIOR)) {
            for (const line of fs.readFileSync(PRIOR, 'utf8').split('\n')) {
              const parts = line.split('\t');
              if (parts.length >= 2 && parts[0]) {
                prior.push({ path: parts[0], line: Number(parts[1]), body: parts[2] ?? '' });
              }
            }
          }

          // ---------- load the model review ----------
          let review;
          try {
            review = JSON.parse(fs.readFileSync(REVIEW, 'utf8'));
          } catch (e) {
            console.error('unparseable review JSON: ' + e.message);
            process.exit(2);
          }
          const comments = Array.isArray(review.comments) ? review.comments : [];
          const summary = String(review.summary ?? '');

          // ---------- filter each comment ----------
          const inline = [];
          const suggestions = [];
          const dropped = [];
          const seen = new Set();
          const drop = (c, reason) => dropped.push({ reason, path: c.path, line: c.line, message: c.message });

          for (const c of comments) {
            const path = String(c.path ?? '');
            const line = Number(c.line ?? -1);
            const message = String(c.message ?? '');
            const evidence = String(c.evidence ?? '');
            const suggestion = typeof c.suggestion === 'string' ? c.suggestion : '';
            const severity = String(c.severity ?? 'SUGGESTION').toUpperCase();

            const key = path + '\t' + line;
            const content = added.get(key);
            if (!content) { drop({ path, line, message }, 'position: ' + key + ' is not an added line'); continue; }

            const dkey = path + '|' + line + '|' + lower(message).slice(0, 120);
            if (seen.has(dkey)) { drop({ path, line, message }, 'duplicate within this review'); continue; }
            seen.add(dkey);

            const priorHit = prior.some((p) =>
              (p.path === path && p.line === line) ||
              (p.body && jaccard(toks(p.body), toks(message)) >= 0.8));
            if (priorHit) { drop({ path, line, message }, 'already raised in a prior review thread'); continue; }

            if (!evidence) { drop({ path, line, message }, 'missing evidence (every comment must quote the flagged line verbatim)'); continue; }
            if (!evidenceMatches(evidence, content)) { drop({ path, line, message }, 'evidence does not match the flagged line'); continue; }

            if (suggestion) {
              const fileContent = norm(fileAdded.get(path) ?? '');
              const sn = norm(suggestion);
              if (sn.length >= 12 && (fileContent.includes(sn) || sn.includes(fileContent))) { drop({ path, line, message }, 'suggestion is already present in the file'); continue; }
              if (jaccard(toks(sn), toks(content)) >= 0.65) { drop({ path, line, message }, 'suggestion duplicates the existing line'); continue; }
            }

            const msgToks = [...new Set([
              ...[...message.matchAll(/`([^`]+)`/g)].map((m) => m[1]),
              ...[...message.matchAll(/\b[A-Za-z_$][\w$]*\.[A-Za-z_$][\w$.]*\b/g)].map((m) => m[0]),
              ...[...message.matchAll(/\b[A-Z][a-zA-Z0-9]{2,}\b/g)].map((m) => m[0]),
            ])];
            if (NEGATION.test(message) && msgToks.some(tokenExistsInRepo)) { drop({ path, line, message }, 'identifier-existence gate: named API exists in the repo or installed packages'); continue; }

            const fileLower = lower(fileAdded.get(path) ?? '');
            if (RACE_CLAIM.test(message) && EFFECT_CLAIM.test(message) && !EFFECT_CLAIM.test(fileLower)) { drop({ path, line, message }, 'claims a useEffect/useMemo/useCallback issue but the diff adds none'); continue; }
          if (RESOURCE_CLAIM.test(message) && lower(content).includes('try (')) { drop({ path, line, message }, 'claims a resource leak / missing close but the line uses try-with-resources'); continue; }

            const body = '[' + severity + '] ' + message + (suggestion ? '\n\n```suggestion\n' + suggestion + '\n```' : '');
            if (severity === 'WARNING' || severity === 'ERROR') inline.push({ path, line, body });
            else suggestions.push({ path, line, severity, message, suggestion });
          }

          process.stdout.write(JSON.stringify({
            summary,
            inline,
            suggestions,
            dropped: dropped.length,
            dropReasons: dropped.slice(0, 8).map((d) => d.reason + ' — ' + d.path + ':' + d.line),
          }));
          NODE
          if ! node /tmp/filter-review.mjs > /tmp/filtered.json 2>/tmp/filter.err; then
            echo "::warning::Review filter failed; posting summary only: $(head -c 200 /tmp/filter.err)"          BODY=$(cat <<EOF
          ## 🤖 AI Code Review
          Model: \`$ACTUAL_MODEL\`

          $SUMMARY_BODY
          EOF
          )
          gh pr comment "$PR_NUMBER" --body "$BODY" || true
            exit 0
          fi

          TOTAL=$(printf '%s' "$REVIEW_JSON" | jq '.comments | length' 2>/dev/null || echo 0)
          INLINE_COUNT=$(jq -r '.inline | length' /tmp/filtered.json)
          SUGG_COUNT=$(jq -r '.suggestions | length' /tmp/filtered.json)
          DROPPED=$(jq -r '.dropped // 0' /tmp/filtered.json)
          echo "Model returned $TOTAL comment(s): $INLINE_COUNT inline, $SUGG_COUNT suggestions, $DROPPED filtered."
          if [ "${DROPPED:-0}" -gt 0 ]; then
            echo "Filtered: $(jq -r '.dropReasons | join("; ")' /tmp/filtered.json)"
          fi

          SUMMARY_BODY=$(jq -n \
            --arg s "$SUMMARY" \
            --argjson sugg "$(jq -c '.suggestions' /tmp/filtered.json)" \
            --argjson dropped "$(jq -r '.dropped // 0' /tmp/filtered.json)" \
            '($s + (if ($sugg | length) > 0 then "\n\n**Suggestions (not blocking):**\n" + ([$sugg[] | ("- `" + .path + ":" + ((.line // 0) | tostring) + "` " + (.message // ""))] | join("\n")) else "" end) + (if $dropped > 0 then "\n\n_" + ($dropped | tostring) + " comment(s) filtered by automated anti-hallucination checks (position, evidence match, duplicates, API existence)._ " else "" end))')

          if [ "$INLINE_COUNT" -gt 0 ]; then
            BODY=$(jq -n \
              --arg commit_id "$(git rev-parse HEAD)" \
              --arg summary "$SUMMARY_BODY" \
              --argjson comments "$(jq -c '.inline' /tmp/filtered.json)" \
              '{event: "COMMENT", commit_id: $commit_id, body: $summary, comments: $comments}')
            if printf '%s' "$BODY" | gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --input - >/dev/null 2>&1; then
              echo "Posted review with $INLINE_COUNT inline comment(s)."
              exit 0
            fi
            echo "::warning::Inline review failed; posting a plain summary comment instead."
          fi

          BODY=$(cat <<EOF
          ## 🤖 AI Code Review
          Model: \`$ACTUAL_MODEL\`

          $SUMMARY
          EOF
          )
          gh pr comment "$PR_NUMBER" --body "$BODY" || true
